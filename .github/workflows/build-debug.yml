name: Build ShadowCodeZ debug APK

on:
  push:
    branches:
      - shadowcodez
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch the Termux am submodule
        run: git submodule update --init --depth 1 termux-am

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowCodeZ-debug-apk
          path: output/*-debug.apk
          if-no-files-found: error
          retention-days: 14
